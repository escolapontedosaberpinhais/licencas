<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Licenças · Escola Ponte do Saber</title>
  <meta name="description" content="Controle de licenças (sanitária, bombeiro, meio ambiente, educação) da Escola Ponte do Saber: vencimentos, arquivos, exigências e renovações." />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
</head>
<body>
  <!-- Tela de login -->
  <div id="login-overlay">
    <div class="login-card">
      <div class="brand" style="justify-content:center;margin-bottom:22px">
        <span class="brand-logo">📋</span>
        <div class="brand-text">
          <strong>Gestão de Licenças</strong>
          <small>Escola Ponte do Saber</small>
        </div>
      </div>
      <p class="login-title">Faça login para acessar o sistema</p>
      <form id="form-login">
        <div class="field">
          <label>E-mail</label>
          <input type="email" name="email" required autocomplete="email" placeholder="seu@email.com">
        </div>
        <div class="field" style="margin-top:12px">
          <label>Senha</label>
          <div class="senha-wrap">
            <input type="password" name="senha" id="login-senha" required autocomplete="current-password" placeholder="Senha">
            <button type="button" class="btn btn-sm" id="toggle-login-senha">mostrar</button>
          </div>
        </div>
        <div id="login-erro" class="login-erro"></div>
        <div class="login-actions">
          <button type="submit" class="btn btn-primary" id="btn-entrar">Entrar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app">
    <!-- Cabeçalho -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo">📋</span>
        <div class="brand-text">
          <strong>Gestão de Licenças</strong>
          <small>Escola Ponte do Saber</small>
        </div>
      </div>
      <nav class="topnav">
        <button class="nav-link active" data-view="dashboard">Painel</button>
        <button class="nav-link" data-view="licencas">Licenças</button>
        <button class="nav-link" data-view="manutencoes">Manutenções</button>
        <button class="nav-link" data-view="fornecedores">Fornecedores</button>
        <button class="nav-link" data-view="config">Backup</button>
      </nav>
      <div class="topbar-actions" style="display:flex;gap:8px;align-items:center">
        <span id="user-email" class="muted" style="font-size:12px"></span>
        <button class="btn btn-primary" id="btn-nova-licenca">+ Nova licença</button>
        <button class="btn" id="btn-logout" title="Sair">Sair</button>
      </div>
    </header>

    <!-- Conteúdo principal -->
    <main id="main" class="main"></main>

    <footer class="footer">
      <span>Dados armazenados com segurança no Supabase (nuvem). Faça backups periódicos na aba <strong>Backup</strong>.</span>
    </footer>
  </div>

  <!-- Modal de licença -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modal-title">Nova licença</h2>
        <button class="icon-btn" id="modal-close" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toasts" class="toasts"></div>

  <!-- Supabase JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Configuração (URL + chave) -->
  <script src="js/config.js"></script>
  <!-- Lógica da aplicação -->
  <script src="js/db.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
